<html>
<body>

    <p>Klik tombol berikut untuk menampilkan prompt</p>

    <button onclick="myFunction()">Klik Disini</button>

    <p id="demo"></p>

    <script>
        function myFunction() 
        {
            var x;

            var name = prompt("Silahkan masukkan nama anda", "Calon Mahasiswa");

            if (name != null) 
                {
                x="Selamat Datang ! " + name + " bagaimana kabarmu hari ini?";
                document.getElementById("demo").innerHTML=x;
            }
        }
    </script>
    
</body>
</html>
