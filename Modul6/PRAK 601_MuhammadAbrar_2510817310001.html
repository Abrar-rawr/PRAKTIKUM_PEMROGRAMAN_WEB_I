<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPhotography</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --color-bg: #0c0d12;
      --color-dark: #f3f4f6;
      --color-mid: #9ca3af;
      --color-light: #6b7280;
      --color-accent: #e0a96d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #1e202b 0%, #0c0d12 100%);
      background-attachment: fixed;
      color: var(--color-dark);
      font-family: 'Montserrat', sans-serif;
    }

    .navbar {
      background: rgba(12, 13, 18, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: transform 0.3s ease-in-out;
    }

    .navbar-hidden {
      transform: translateY(-100%);
    }

    .navbar-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--color-dark) !important;
      letter-spacing: 0.5px;
    }

    .navbar-toggler {
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      padding: 4px 8px;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%28243, 244, 246, 0.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
    }

    .nav-link {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--color-mid) !important;
      padding: 8px 14px !important;
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: var(--color-dark) !important;
    }

    .nav-link.active {
      color: var(--color-accent) !important;
      border: 1px solid var(--color-accent);
      border-radius: 2px;
    }

    @media (max-width: 991.98px) {
      .navbar-collapse {
        padding: 12px 0 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin-top: 10px;
        background: rgba(12, 13, 18, 0.95);
        border-radius: 4px;
        padding-left: 15px;
        padding-right: 15px;
      }

      .nav-link {
        padding: 10px 0 !important;
      }

      .nav-link.active {
        border: none;
        border-radius: 0;
        border-left: 3px solid var(--color-accent);
        padding-left: 10px !important;
      }
    }

    .hero {
      padding: 80px 16px 60px;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
      color: var(--color-dark);
    }

    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--color-accent);
    }

    .hero .subtitle {
      font-size: 0.68rem;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--color-light);
      font-weight: 400;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      padding: 20px 0 36px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--color-mid);
      cursor: pointer;
      padding: 6px 12px;
      transition: color 0.2s;
      letter-spacing: 0.5px;
    }

    .filter-btn.active {
      border: 1px solid var(--color-accent);
      border-radius: 30px;
      color: var(--color-accent);
      font-weight: 600;
    }

    .filter-btn:hover {
      color: var(--color-dark);
    }

    .photo-grid {
      padding: 0;
    }

    .photo-item {
      cursor: pointer;
    }

    .photo-frame {
      overflow: hidden;
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      height: 0;
    }

    .photo-item[data-category="landscape"] .photo-frame {
      padding-bottom: 56.25%;
    }

    .photo-item[data-category="portrait"] .photo-frame {
      padding-bottom: 133.33%;
    }

    .photo-item[data-category="product"] .photo-frame {
      padding-bottom: 100%;
    }

    .photo-grid.force-square .photo-frame {
      padding-bottom: 100% !important;
    }

    .photo-frame img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s ease;
      filter: grayscale(10%);
    }

    .photo-frame:hover img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .photo-grid .row {
      --bs-gutter-x: 10px;
      --bs-gutter-y: 10px;
    }

    footer {
      text-align: center;
      padding: 60px 16px 40px;
    }

    footer .footer-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--color-dark);
      display: block;
      margin-bottom: 6px;
    }

    footer .copyright {
      font-size: 0.72rem;
      color: var(--color-light);
      letter-spacing: 0.3px;
      margin-bottom: 20px;
    }

    footer .social-icons {
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    footer .social-icons a {
      color: var(--color-mid);
      font-size: 1.15rem;
      text-decoration: none;
      transition: color 0.2s, transform 0.2s;
    }

    footer .social-icons a:hover {
      color: var(--color-accent);
      transform: translateY(-2px);
    }

    @media (max-width: 576px) {
      .hero {
        padding: 50px 12px 40px;
      }

      .filter-bar {
        gap: 14px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">RawrrGallery</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav gap-1">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About Me</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1>Hi. Hello.. I Am Abrar...!</h1>
      <h2>Ini Para Karakter Favoritku.!</h2>
      <p class="subtitle">Dari yang sudah tamat sampai yang masih On-Going</p>
    </div>
  </section>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterPhotos('all', this)">All</button>
    <button class="filter-btn" onclick="filterPhotos('landscape', this)">Landscape</button>
    <button class="filter-btn" onclick="filterPhotos('portrait', this)">Portrait</button>
    <button class="filter-btn" onclick="filterPhotos('product', this)">Product</button>
  </div>

  <main class="photo-grid force-square container-fluid px-2">
    <div class="row g-1">
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="luffy.jpg" alt="Monkey D. Luffy" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="Naruto.jpg" alt="Naruto Uzumaki" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="shihao.jpg" alt="Shihao" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="Zoro.jpg" alt="Zoro" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="hany.jpg" alt="Han Yslat" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="Orv.jpg" alt="Omniscient_Reader_Viewpoint" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="djoka.jpg" alt="djoka" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="yvolka.jpg" alt="yvolka" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="product">
        <div class="photo-frame"><img src="Dokubi.jpg" alt="Dokubi" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="product">
        <div class="photo-frame"><img src="dokobi.jpg" alt="Dokobi" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="Jonghyuk.jpg" alt="Yoo Jonghyuk" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="Jinwoo.jpg" alt="Sung Jinwoo" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="yoosangha.jpg" alt="Yoo Sangha" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="Wangling.jpg" alt="Wang Lin" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="landscape">
        <div class="photo-frame"><img src="tangsang.jpg" alt="Tang San" /></div>
      </div>
      <div class="col-6 col-sm-4 col-md-3 photo-item" data-category="portrait">
        <div class="photo-frame"><img src="hansooyoung.jpg" alt="Han Sooyoung" /></div>
      </div>
    </div>
  </main>

  <footer>
    <span class="footer-brand">RawrrGallery</span>
    <p class="copyright">&copy; Copyrights 2026. All Rights Reserved.</p>
    <div class="social-icons">
      <a href="https://wa.me/6281348742169" aria-label="Whatsapp"><i class="bi bi-whatsapp"></i></a>
      <a href="https://www.youtube.com" aria-label="youtube"><i class="bi bi-youtube"></i></a>
      <a href="https://www.instagram.com/m_abrarr__?igsh=N2pnbDJhdTY1cGxj&utm_source=qr" aria-label="Instagram"><i
          class="bi bi-instagram"></i></a>
      <a href="https://www.telegram.org" aria-label="Telegram"><i class="bi bi-telegram"></i></a>
      <a href="https://www.threads.com" aria-label="threads"><i class="bi bi-threads"></i></a>
      <a href="https://www.facebook.com" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a href="https://www.x.com" aria-label="Twitter"><i class="bi bi-twitter-x"></i></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function filterPhotos(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const grid = document.querySelector('.photo-grid');
      if (category === 'all') {
        grid.classList.add('force-square');
      } else {
        grid.classList.remove('force-square');
      }

      document.querySelectorAll('.photo-item').forEach(item => {
        if (category === 'all' || item.dataset.category === category) {
          item.style.display = '';
        } else {
          item.style.display = 'none';
        }
      });
    }

    let lastScrollY = window.scrollY;
    const navbar = document.querySelector('.navbar');
    const navMenu = document.getElementById('navMenu');

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      const isMenuOpen = navMenu && navMenu.classList.contains('show');

      if (currentScrollY > lastScrollY && currentScrollY > 100 && !isMenuOpen) {
        navbar.classList.add('navbar-hidden');
      } else {
        navbar.classList.remove('navbar-hidden');
      }
      lastScrollY = currentScrollY;
    });
  </script>
</body>

</html>
